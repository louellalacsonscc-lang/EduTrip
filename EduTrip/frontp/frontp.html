<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrip — Home</title>
    <link rel="stylesheet" href="frontp.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="links">
            <a href="#">ABOUT</a>
            <a href="#">SERVICES</a>
        </div>
        <div class="auth-buttons">
            <button class="btn small">SIGN IN</button>
            <button class="btn small outline">SIGN OUT</button>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>WELCOME TO EDUTRIP</h1>
        <p class="short-desc">Your gateway to announcements, seminars, and educational tours.</p>
    </section>

    <!-- CAROUSEL TITLE -->
    <h2 class="carousel-title" id="carouselTitle">NEW ANNOUNCEMENT</h2>

    <!-- CAROUSEL -->
    <div class="carousel-container">

        <div class="arrow left" onclick="prevSlide()">&#8592;</div>

        <div class="carousel">
            <!-- LEFT CARD -->
            <div class="card small" id="leftCard">
                <img src="https://via.placeholder.com/250x150" class="card-img">
            </div>

            <!-- CENTER CARD -->
            <div class="card center" id="centerCard">
                <img src="https://via.placeholder.com/350x200" class="card-img">
                <p id="centerDescription">Announcement description…</p>
            </div>

            <!-- RIGHT CARD -->
            <div class="card small" id="rightCard">
                <img src="https://via.placeholder.com/250x150" class="card-img">
            </div>
        </div>

        <div class="arrow right" onclick="nextSlide()">&#8594;</div>

    </div>

<script src="frontp.js"></script>
</body>
</html>

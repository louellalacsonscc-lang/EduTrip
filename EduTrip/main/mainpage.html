<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Boxicons -->
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <title>EduTrip | Login</title>
    <!-- Custom black theme with blue accents -->
    <style>
        /* Black theme */
        .black-bg {
            background: #000000;
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        /* Neon blue glow effects */
        .neon-glow {
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5),
                        0 0 20px rgba(59, 130, 246, 0.3),
                        0 0 30px rgba(59, 130, 246, 0.1);
        }
        .neon-glow-hover:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.7),
                        0 0 25px rgba(59, 130, 246, 0.4),
                        0 0 35px rgba(59, 130, 246, 0.2);
        }
        .text-glow {
            text-shadow: 0 0 5px rgba(59, 130, 246, 0.7);
        }
    </style>
</head>

<body class="black-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-900 rounded-2xl mb-4 border border-gray-800">
                <i class='bx bxs-bus text-4xl text-blue-500'></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">EduTrip</h1>
            <p class="text-gray-400">Educational Trips & Events Platform</p>
        </div>

        <!-- Login/Register Card -->
        <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
            <!-- Toggle Buttons -->
            <div class="flex border-b border-gray-800">
                <button id="login-toggle" 
                        class="flex-1 py-4 font-semibold text-white bg-gray-900 border-b-2 border-blue-500 transition-all duration-300">
                    <i class='bx bx-log-in mr-2 text-blue-400'></i>
                    Login
                </button>
                <button id="register-toggle" 
                        class="flex-1 py-4 font-semibold text-gray-400 hover:text-white transition-all duration-300 border-b-2 border-transparent">
                    <i class='bx bx-user-plus mr-2 text-gray-500'></i>
                    Register
                </button>
            </div>

<!-- Login Form -->
<div id="login-form" class="p-8">
    <h2 class="text-2xl font-bold text-white mb-6">Welcome Back</h2>
    <form id="loginForm">
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class='bx bx-envelope text-gray-500'></i>
                    </div>
                    <input type="email" required 
                           class="pl-10 w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                           placeholder="student@example.com">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class='bx bx-lock-alt text-gray-500'></i>
                    </div>
                    <input type="password" required 
                           class="pl-10 w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]">
                <i class='bx bx-log-in mr-2'></i>
                Sign In
            </button>
        </div>
    </form>
</div>

            <!-- Register Form -->
            <div id="register-form" class="p-8 hidden">
                <h2 class="text-2xl font-bold text-white mb-6">Create Account</h2>
                <form id="registerForm">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class='bx bx-user text-gray-500'></i>
                                </div>
                                <input type="text" required 
                                       class="pl-10 w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                                       placeholder="John Doe">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Student Number</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class='bx bx-id-card text-gray-500'></i>
                                </div>
                                <input type="text" required 
                                       class="pl-10 w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                                       placeholder="S123456">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class='bx bx-envelope text-gray-500'></i>
                                </div>
                                <input type="email" required 
                                       class="pl-10 w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                                       placeholder="student@example.com">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                                <input type="password" required 
                                       class="w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                                       placeholder="••••••••">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
                                <input type="password" required 
                                       class="w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                                       placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" 
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]">
                            <i class='bx bx-user-plus mr-2'></i>
                            Create Account
                        </button>
                    </div>
                </form>
                
                <p class="mt-6 text-center text-gray-500 text-sm">
                    Already have an account? 
<button type="button" id="switch-to-login" class="text-blue-400 hover:text-blue-300 font-semibold ml-1">
    Sign in here
</button>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <p class="mt-8 text-center text-gray-600 text-sm">
            © 2024 EduTrip. Educational platform for trips and events.
        </p>
    </div>

    <script src="/main/mainpage.js"></script>
</body>
</html>

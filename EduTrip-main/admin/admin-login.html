<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/tailwind-output.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <title>EduEvent Admin Login</title>
    <style>
        .black-bg {
            background: #000000;
        }

        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }

        .neon-glow {
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5),
                0 0 20px rgba(59, 130, 246, 0.3),
                0 0 30px rgba(59, 130, 246, 0.1);
        }

        .neon-glow-hover:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.7),
                0 0 25px rgba(59, 130, 246, 0.4),
                0 0 35px rgba(59, 130, 246, 0.2);
        }

        .text-glow {
            text-shadow: 0 0 5px rgba(59, 130, 246, 0.7);
        }
    </style>
</head>

<body class="black-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-gray-900 rounded-2xl mb-4 border border-gray-800">
                <i class='bx bxs-bus text-4xl text-blue-500'></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">EduEvent Admin</h1>
            <p class="text-gray-400">Admin login area for EduEvent management</p>
        </div>

        <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden shadow-lg">
            <div class="p-8">
                <h2 class="text-2xl font-bold text-white mb-6">Admin Login</h2>
                <form id="admin-login-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class='bx bx-envelope text-gray-500'></i>
                            </div>
                            <input id="admin-email" type="email" required
                                class="pl-10 w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                                placeholder="admin@eduevent.com">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class='bx bx-lock-alt text-gray-500'></i>
                            </div>
                            <input id="admin-password" type="password" required
                                class="pl-10 w-full px-4 py-3 bg-black border border-gray-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-600 input-focus transition-all"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]">
                        <i class='bx bx-log-in mr-2'></i>
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-6 text-gray-400 text-sm">
                    <p>Use your admin credentials to access the admin portal.</p>
                    <p class="mt-3">Need student login? <a href="/login" class="text-blue-400 hover:text-blue-300">Go to
                            student login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-login.js"></script>
</body>

</html>
